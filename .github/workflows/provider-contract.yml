name: AI Provider Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  group: ai-provider-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-contract:
    name: Provider Contract / Jev + Laguna
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_PROVIDER: openrouter
      AI_GENERATIVE_MODEL: ${{ vars.NOCTURNE_GENERATIVE_MODEL || vars.AI_GENERATIVE_MODEL || 'qwen/qwen3.7-flash' }}
      AI_MODEL: ${{ vars.NOCTURNE_GENERATIVE_MODEL || vars.AI_GENERATIVE_MODEL || vars.AI_MODEL || 'qwen/qwen3.7-flash' }}
      AI_AUTHORITATIVE_MODEL: ${{ vars.AI_AUTHORITATIVE_MODEL || vars.NOCTURNE_GENERATIVE_MODEL || vars.AI_GENERATIVE_MODEL || vars.AI_MODEL || 'qwen/qwen3.7-flash' }}
      AI_CREATIVE_MODEL: ${{ vars.AI_CREATIVE_MODEL || vars.NOCTURNE_GENERATIVE_MODEL || vars.AI_GENERATIVE_MODEL || vars.AI_MODEL || 'qwen/qwen3.7-flash' }}
      AI_NARRATION_MODEL: ${{ vars.NOCTURNE_NARRATION_MODEL || vars.AI_NARRATION_MODEL || 'poolside/laguna-xs-2.1' }}
      AI_DECISION_MODEL: ${{ vars.NOCTURNE_DECISION_MODEL || vars.AI_DECISION_MODEL || 'typesafe/jev-1.13-20260917' }}
      AI_DECISION_TIMEOUT_MS: ${{ vars.AI_DECISION_TIMEOUT_MS || '5000' }}
      AI_BASE_URL: https://openrouter.ai/api/v1
      AI_THINKING_MODE: ${{ vars.AI_THINKING_MODE || 'disabled' }}
      AI_JSON_MODE: ${{ vars.AI_JSON_MODE || 'true' }}
      AI_SEND_TEMPERATURE: ${{ vars.AI_SEND_TEMPERATURE || 'true' }}
      AI_MAX_TOKENS: ${{ vars.AI_MAX_TOKENS || '4096' }}
      AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS || '60000' }}
      AI_EXTRA_BODY_JSON: ${{ vars.AI_EXTRA_BODY_JSON || '{}' }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check live-provider credential availability
        id: configuration
        shell: bash
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::OPENROUTER_API_KEY is required for the trusted live provider contract."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Verify Jev decisions, Laguna narration, and transitional structured generation
        if: steps.configuration.outputs.enabled == 'true'
        run: |
          mkdir -p artifacts
          set -o pipefail
          pnpm --filter @nocturne/ai-gm test:provider-contract 2>&1 | tee artifacts/provider-contract.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-contract-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
