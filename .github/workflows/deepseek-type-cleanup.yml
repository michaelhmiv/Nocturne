name: Clean DeepSeek provider types

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'fix/deepseek-flash-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deepseek-flash-only
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Repair shared generation result type
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('packages/ai-gm/src/ai-provider.ts')
          text = path.read_text(encoding='utf-8')
          old = '''export interface StructuredGenerationResult<T> {
            data: T;
            requestedModel: typeof DEEPSEEK_FLASH_MODEL;
            actualModel: string;
            provider: "deepseek";
            providerRequestId?: string;
            attempts: number;
            latencyMs: number;
          }'''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''export interface StructuredGenerationResult<T> {
            data: T;
            requestedModel: string;
            actualModel: string;
            provider?: "deepseek";
            providerRequestId?: string;
            attempts?: number;
            latencyMs?: number;
          }'''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if old not in text:
              raise SystemExit('StructuredGenerationResult block was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/api/src/action-service.ts
          apps/api/src/app.ts
          apps/api/src/conversation-service.ts
          apps/api/src/invention-service.ts
          apps/api/test/app.test.ts
          packages/ai-gm/src/action-adjudicator.ts
          packages/ai-gm/src/ai-provider.test.ts
          packages/ai-gm/src/ai-provider.ts
          packages/ai-gm/src/consumable-analyzer.ts
          packages/ai-gm/src/content-normalizer.ts
          packages/ai-gm/src/conversation-adjudicator.ts
          packages/ai-gm/src/index.ts
          packages/ai-gm/src/model-policy.ts
          packages/ai-gm/test/conversation-adjudicator.test.ts
          packages/ai-gm/test/model-policy.test.ts
          README.md
          docs/AI_MODEL_POLICY.md
          docs/PR3_GENERATED_INVENTIONS.md
          docs/PR_TESTING.md
          docs/RAILWAY.md
          docs/plans/2026-07-29-conversational-core.md
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/deepseek-type-cleanup.yml
          git add -A
          git commit -m "fix: clean DeepSeek Flash provider types"
          git push origin HEAD:fix/deepseek-flash-only
