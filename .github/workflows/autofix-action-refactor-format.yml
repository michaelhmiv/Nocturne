name: Autofix Action Refactor Format

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'feat/')
    runs-on: ubuntu-24.04
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply coordinated typed event semantics
        if: github.head_ref == 'feat/typed-event-semantics'
        run: |
          python3 <<'BOOT'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/temporary-typed-event-semantics.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit('Temporary patch payload markers were not found.')
          payload = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          exec(dedent(payload), {'__name__': '__main__'})
          BOOT
          git checkout origin/main -- .github/workflows/autofix-action-refactor-format.yml
      - name: Apply repository formatting
        run: pnpm exec prettier --write .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply coordinated typed event semantics"
          git push origin "HEAD:${HEAD_REF}"
