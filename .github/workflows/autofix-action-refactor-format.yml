name: Autofix Action Refactor Format

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'feat/')
    runs-on: ubuntu-24.04
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install and update importer lockfile
        if: github.head_ref == 'feat/nyc-geospatial-importer'
        run: pnpm install --no-frozen-lockfile
      - name: Install from existing lockfile
        if: github.head_ref != 'feat/nyc-geospatial-importer'
        run: pnpm install --frozen-lockfile
      - name: Apply repository formatting
        run: pnpm exec prettier --write .
      - name: Restore trusted workflow definition
        if: github.head_ref == 'feat/nyc-geospatial-importer'
        run: git checkout origin/main -- .github/workflows/autofix-action-refactor-format.yml
      - name: Commit generated files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: generate importer workspace lockfile"
          git push origin "HEAD:${HEAD_REF}"
