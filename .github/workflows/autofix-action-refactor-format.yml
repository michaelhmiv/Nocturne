name: Autofix Action Refactor Format

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'test/') || startsWith(github.head_ref, 'fix/mcp-cert-health-contract'))
    runs-on: ubuntu-24.04
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Update production certification health paths
        if: startsWith(github.head_ref, 'fix/mcp-cert-health-contract')
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/mcp-production-certification.mjs")
          text = path.read_text()
          replacements = {
              'health?.operational?.database?.ready': 'health?.operational?.dependencies?.database?.ready',
              'health?.operational?.database?.migrationsReady': 'health?.operational?.dependencies?.database?.migrationsReady',
              'health?.operational?.worker?.configured': 'health?.operational?.dependencies?.worker?.configured',
              'health?.operational?.worker?.online': 'health?.operational?.dependencies?.worker?.online',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"expected health contract path not found: {old}")
          path.write_text(text)
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatting
        run: pnpm exec prettier --write .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply repository formatting"
          git push origin "HEAD:${HEAD_REF}"
