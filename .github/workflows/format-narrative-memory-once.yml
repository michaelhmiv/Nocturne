name: One-time narrative memory formatting

on:
  push:
    branches:
      - feat/narrative-memory-context

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/narrative-memory-context
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/api/src/persistent-world-action-service.ts
          apps/api/src/persistent-world-runtime.ts
          packages/ai-gm/src/persistent-world-planner.ts
          packages/ai-gm/src/persistent-world-planner.test.ts
          packages/ai-gm/src/provider-contract.ts
          packages/contracts/src/world-action.ts
          packages/database/src/index.ts
          packages/database/src/narrative-memory-store.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/src/persistent-world-action-service.ts apps/api/src/persistent-world-runtime.ts packages/ai-gm/src/persistent-world-planner.ts packages/ai-gm/src/persistent-world-planner.test.ts packages/ai-gm/src/provider-contract.ts packages/contracts/src/world-action.ts packages/database/src/index.ts packages/database/src/narrative-memory-store.ts
          git commit -m "style: format narrative memory implementation"
          git push origin HEAD:feat/narrative-memory-context
