name: Repair database declarations

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/deepseek-flash-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deepseek-flash-only
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Repair declaration errors exposed by full build
        run: |
          python <<'PY'
          from pathlib import Path

          consumption = Path('packages/database/src/consumption-store.ts')
          text = consumption.read_text(encoding='utf-8')
          dependency = 'import type { ConsumptionMechanicsResult } from "@nocturne/rules-engine";\n'
          local_type = '''type ConsumptionMechanicsResult = {
            outcomeGrade:
              | "complete_success"
              | "success_with_consequence"
              | "partial_success"
              | "failure_with_progress"
              | "failure"
              | "catastrophic_reversal";
            resourceDeltas: Array<{ resource: string; delta: number; rationale: string }>;
            conditions: Array<{
              name: string;
              key: string;
              intensity: number;
              durationSeconds: number;
              rationale: string;
            }>;
            risks: Array<{ description: string; occurred: boolean }>;
            calculationTrace: string[];
          };
          '''
          local_type = '\n'.join(line[10:] if line.startswith('          ') else line for line in local_type.splitlines()) + '\n'
          if dependency not in text:
              raise SystemExit('Rules-engine type import not found')
          text = text.replace(dependency, local_type)

          start_marker = '    const candidates: ConsumptionCandidate[] = entityRows'
          end_marker = '      .filter((candidate): candidate is ConsumptionCandidate => Boolean(candidate));'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''    const candidates = entityRows.reduce<ConsumptionCandidate[]>((result, row) => {
            const state = object(row.state);
            const quantity = availableQuantity(state);
            if (quantity <= 0) return result;
            const owned = row.owner_id && String(row.owner_id) === input.actorId;
            const carried =
              (row.location_id && String(row.location_id) === input.actorId) ||
              Boolean(row.related_to_actor);
            const revisionPayload = object(row.payload);
            const cachedProfile = object(state.semanticProfile);
            result.push({
              sourceType: "entity",
              sourceId: String(row.instance_id),
              name: String(row.name),
              description: [
                String(row.concept_summary || row.name),
                Object.keys(revisionPayload).length
                  ? `Definition: ${JSON.stringify(revisionPayload).slice(0, 1_000)}`
                  : "",
                Object.keys(cachedProfile).length
                  ? `Existing semantic profile: ${JSON.stringify(cachedProfile).slice(0, 1_000)}`
                  : "",
              ]
                .filter(Boolean)
                .join("\\n"),
              access: carried ? "carried" : owned ? "owned" : "visible",
              quantity,
              state,
              constraints: arrayOfStrings(state.constraints),
            });
            return result;
          }, []);'''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          consumption.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          obsolete = Path('packages/database/src/rules-engine-types.d.ts')
          if obsolete.exists():
              obsolete.unlink()

          game = Path('packages/database/src/game-store.ts')
          text = game.read_text(encoding='utf-8')
          create_start = text.index('  async function createCharacter(')
          return_start = text.index('      return {\n        characterId,', create_start)
          old = '        createdAt,\n      };'
          position = text.index(old, return_start)
          new = '''        createdAt,
              cashOnPerson: 50_000,
              heat: 0,
              warrant: false,
              status: "active",
              factionStanding: {},
              skills: {},
              inventory: [],
            };'''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          game.write_text(text[:position] + new + text[position + len(old):], encoding='utf-8')

          action = Path('apps/api/src/action-service.ts')
          text = action.read_text(encoding='utf-8')
          text = text.replace(
              '  type ActionExecutionResponse,\n  type ParsedActionEnvelope,',
              '  type ActionExecutionResponse,\n  type OutcomeGrade,\n  type ParsedActionEnvelope,',
          )
          hash_line = 'const hash = (value: unknown) => createHash("sha256").update(JSON.stringify(value)).digest("hex");\n'
          guard = '''
          const OUTCOME_GRADES = new Set<OutcomeGrade>([
            "complete_success",
            "success_with_consequence",
            "partial_success",
            "failure_with_progress",
            "failure",
            "catastrophic_reversal",
          ]);

          function requireOutcomeGrade(value: string): OutcomeGrade {
            if (!OUTCOME_GRADES.has(value as OutcomeGrade)) {
              throw new Error(`Unknown committed outcome grade: ${value}`);
            }
            return value as OutcomeGrade;
          }
          '''
          guard = '\n'.join(line[10:] if line.startswith('          ') else line for line in guard.splitlines())
          if hash_line not in text:
              raise SystemExit('Action-service hash anchor not found')
          text = text.replace(hash_line, hash_line + guard + '\n', 1)
          text = text.replace(
              '    const xpGain = xpFromOutcome(committed.outcomeGrade);',
              '    const outcomeGrade = requireOutcomeGrade(committed.outcomeGrade);\n    const xpGain = xpFromOutcome(outcomeGrade);',
              1,
          )
          text = text.replace(
              'heatFromCrime(actionType, committed.outcomeGrade)',
              'heatFromCrime(actionType, outcomeGrade)',
          )
          text = text.replace(
              'resolveIntercept(heat, committed.outcomeGrade, roll)',
              'resolveIntercept(heat, outcomeGrade, roll)',
          )
          action.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format repaired files
        run: pnpm exec prettier --write packages/database/src/consumption-store.ts packages/database/src/game-store.ts apps/api/src/action-service.ts
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Test workspace
        run: pnpm test
      - name: Build workspace
        run: pnpm build
      - name: Commit verified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/database-type-cleanup.yml
          git add -A
          git commit -m "fix: repair strict workspace types"
          git push origin HEAD:fix/deepseek-flash-only
