name: Repair database declarations

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'fix/deepseek-flash-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deepseek-flash-only
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Repair declaration errors exposed by full build
        run: |
          python <<'PY'
          from pathlib import Path

          consumption = Path('packages/database/src/consumption-store.ts')
          text = consumption.read_text(encoding='utf-8')
          old = '''    const candidates: ConsumptionCandidate[] = entityRows
              .map((row) => {
                const state = object(row.state);
                const quantity = availableQuantity(state);
                if (quantity <= 0) return null;
                const owned = row.owner_id && String(row.owner_id) === input.actorId;
                const carried =
                  (row.location_id && String(row.location_id) === input.actorId) ||
                  Boolean(row.related_to_actor);
                const revisionPayload = object(row.payload);
                const cachedProfile = object(state.semanticProfile);
                return {
                  sourceType: "entity" as const,
                  sourceId: String(row.instance_id),
                  name: String(row.name),
                  description: [
                    String(row.concept_summary || row.name),
                    Object.keys(revisionPayload).length
                      ? `Definition: ${JSON.stringify(revisionPayload).slice(0, 1_000)}`
                      : "",
                    Object.keys(cachedProfile).length
                      ? `Existing semantic profile: ${JSON.stringify(cachedProfile).slice(0, 1_000)}`
                      : "",
                  ]
                    .filter(Boolean)
                    .join("\\n"),
                  access: carried ? ("carried" as const) : owned ? ("owned" as const) : ("visible" as const),
                  quantity,
                  state,
                  constraints: arrayOfStrings(state.constraints),
                };
              })
              .filter((candidate): candidate is ConsumptionCandidate => Boolean(candidate));'''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''    const candidates = entityRows.reduce<ConsumptionCandidate[]>((result, row) => {
              const state = object(row.state);
              const quantity = availableQuantity(state);
              if (quantity <= 0) return result;
              const owned = row.owner_id && String(row.owner_id) === input.actorId;
              const carried =
                (row.location_id && String(row.location_id) === input.actorId) ||
                Boolean(row.related_to_actor);
              const revisionPayload = object(row.payload);
              const cachedProfile = object(state.semanticProfile);
              result.push({
                sourceType: "entity",
                sourceId: String(row.instance_id),
                name: String(row.name),
                description: [
                  String(row.concept_summary || row.name),
                  Object.keys(revisionPayload).length
                    ? `Definition: ${JSON.stringify(revisionPayload).slice(0, 1_000)}`
                    : "",
                  Object.keys(cachedProfile).length
                    ? `Existing semantic profile: ${JSON.stringify(cachedProfile).slice(0, 1_000)}`
                    : "",
                ]
                  .filter(Boolean)
                  .join("\\n"),
                access: carried ? "carried" : owned ? "owned" : "visible",
                quantity,
                state,
                constraints: arrayOfStrings(state.constraints),
              });
              return result;
            }, []);'''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if old not in text:
              raise SystemExit('Consumption candidate block not found')
          consumption.write_text(text.replace(old, new), encoding='utf-8')

          game = Path('packages/database/src/game-store.ts')
          text = game.read_text(encoding='utf-8')
          old = '''        createdAt,
              };'''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '''        createdAt,
                cashOnPerson: 50_000,
                heat: 0,
                warrant: false,
                status: "active",
                factionStanding: {},
                skills: {},
                inventory: [],
              };'''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if old not in text:
              raise SystemExit('Created character summary block not found')
          game.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format repaired files
        run: pnpm exec prettier --write packages/database/src/consumption-store.ts packages/database/src/game-store.ts
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Test workspace
        run: pnpm test
      - name: Build workspace
        run: pnpm build
      - name: Commit verified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/database-type-cleanup.yml
          git add -A
          git commit -m "fix: repair database declaration types"
          git push origin HEAD:fix/deepseek-flash-only
