name: One-time format artifact

on:
  push:
    branches:
      - feat/gm-context-constitution

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gm-context-constitution
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/ai-gm/src/game-constitution.ts packages/ai-gm/src/game-constitution.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/ai-gm/src/game-constitution.ts packages/ai-gm/src/game-constitution.test.ts
          git commit -m "style: format game master context"
          git push origin HEAD:feat/gm-context-constitution
