name: OpenRouter Gameplay Evaluation
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "scripts/evals/**"
      - ".github/workflows/model-evaluation.yml"
      - "packages/ai-gm/src/decision-client.ts"
      - "packages/ai-gm/src/world-action-decision.ts"
      - "packages/ai-gm/src/consumable-decision.ts"
      - "packages/ai-gm/src/player-safe-narrator.ts"
      - "packages/ai-gm/src/action-adjudicator.ts"
  push:
    branches:
      - main
    paths:
      - "scripts/evals/**"
      - ".github/workflows/model-evaluation.yml"
      - "packages/ai-gm/src/decision-client.ts"
      - "packages/ai-gm/src/world-action-decision.ts"
      - "packages/ai-gm/src/consumable-decision.ts"
permissions:
  contents: read
concurrency:
  group: model-evaluation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODELS: ${{ vars.NOCTURNE_EVAL_MODELS || '~typesafe/jev-latest,qwen/qwen3.7-flash' }}
      EVAL_REPETITIONS: "2"
      NARRATION_MODELS: ${{ vars.NOCTURNE_NARRATION_MODELS || 'poolside/laguna-xs-2.1' }}
      NARRATION_REPETITIONS: "2"
      JEV_NATIVE_MODEL: ${{ vars.NOCTURNE_DECISION_MODEL || vars.AI_DECISION_MODEL || '~typesafe/jev-latest' }}
      JEV_NATIVE_REPETITIONS: "3"
      PROSE_JUDGE_MODEL: ${{ vars.NOCTURNE_PROSE_JUDGE_MODEL || 'openai/gpt-5.6-luna' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluate legacy cross-model gameplay corpus
        run: node scripts/evals/openrouter-gameplay.mjs
      - name: Evaluate Jev native semantic contract
        run: node scripts/evals/jev-native-actions.mjs
      - name: Compare narration models on latency and committed-fact consistency
        run: node scripts/evals/openrouter-narration.mjs
      - name: Judge prose fidelity and quality
        run: node scripts/evals/openrouter-prose-quality.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-gameplay-${{ github.sha }}
          path: |
            artifacts/model-evaluation/
            artifacts/jev-native-evaluation/
            artifacts/narration-evaluation/
          retention-days: 30
