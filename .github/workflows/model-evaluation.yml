name: OpenRouter Gameplay Evaluation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/evals/**"
      - ".github/workflows/model-evaluation.yml"
permissions:
  contents: read
concurrency:
  group: model-evaluation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_MODELS: ${{ vars.NOCTURNE_EVAL_MODELS }}
      EVAL_REPETITIONS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Evaluate live decisions and discover Jev
        run: node scripts/evals/openrouter-gameplay.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-gameplay-${{ github.sha }}
          path: artifacts/model-evaluation/
          retention-days: 30
