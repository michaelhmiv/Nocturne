name: DeepSeek Flash-only codemod

on:
  push:
    branches:
      - fix/deepseek-flash-only

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove OpenRouter and enforce DeepSeek Flash
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          ai_provider = r'''import type { ZodType } from "zod";
          import {
            DEEPSEEK_FLASH_MODEL,
            createModelPolicy,
            type AiTask,
          } from "./model-policy.js";

          export interface JsonSchemaDefinition {
            name: string;
            description?: string;
            schema: Record<string, unknown>;
          }

          export interface AiProviderTelemetry {
            task: AiTask;
            provider: "deepseek";
            model: typeof DEEPSEEK_FLASH_MODEL;
            attempt: number;
            latencyMs: number;
            status: "success" | "error";
            errorCode?: AiProviderErrorCode;
          }

          export interface AiProviderConfig {
            deepseekApiKey?: string;
            timeoutMs?: number;
            logger?: (entry: AiProviderTelemetry) => void;
          }

          export interface StructuredGenerationRequest<T> {
            task: AiTask;
            system: string;
            prompt: string;
            jsonSchema: JsonSchemaDefinition;
            validator: ZodType<T>;
            requestedModel?: string;
            signal?: AbortSignal;
          }

          export interface StructuredGenerationResult<T> {
            data: T;
            requestedModel: typeof DEEPSEEK_FLASH_MODEL;
            actualModel: string;
            provider: "deepseek";
            providerRequestId?: string;
            attempts: number;
            latencyMs: number;
          }

          export type AiProviderErrorCode =
            | "configuration"
            | "aborted"
            | "timeout"
            | "rate_limited"
            | "provider_rejected"
            | "provider_failure"
            | "malformed_response"
            | "validation";

          export class AiProviderError extends Error {
            cause?: unknown;

            constructor(
              readonly code: AiProviderErrorCode,
              message: string,
              options?: { cause?: unknown },
            ) {
              super(message);
              this.name = "AiProviderError";
              if (options && "cause" in options) this.cause = options.cause;
            }
          }

          export function isTransientAiProviderError(error: unknown): error is AiProviderError {
            return (
              error instanceof AiProviderError &&
              ["timeout", "rate_limited", "provider_failure", "malformed_response", "validation"].includes(
                error.code,
              )
            );
          }

          interface ProviderResponse {
            id?: string;
            model?: string;
            choices?: Array<{
              finish_reason?: string | null;
              message?: { content?: string | null };
            }>;
            error?: { message?: string; type?: string; code?: string | number };
          }

          type JsonObject = Record<string, unknown>;

          function object(value: unknown): value is JsonObject {
            return !!value && typeof value === "object" && !Array.isArray(value);
          }

          function resolveSchema(schema: unknown, root: JsonObject): JsonObject | undefined {
            if (!object(schema)) return undefined;
            const reference = schema.$ref;
            if (typeof reference !== "string" || !reference.startsWith("#/")) return schema;
            const resolved = reference
              .slice(2)
              .split("/")
              .map((part) => part.replace(/~1/g, "/").replace(/~0/g, "~"))
              .reduce<unknown>((value, part) => (object(value) ? value[part] : undefined), root);
            return object(resolved) ? resolved : schema;
          }

          function allowsNull(schema: unknown, root: JsonObject): boolean {
            const resolved = resolveSchema(schema, root);
            if (!resolved) return false;
            if (resolved.type === "null") return true;
            if (Array.isArray(resolved.type) && resolved.type.includes("null")) return true;
            return [resolved.anyOf, resolved.oneOf].some(
              (variants) =>
                Array.isArray(variants) && variants.some((variant) => allowsNull(variant, root)),
            );
          }

          function omitUnexpectedNulls(value: unknown, schema: unknown, root: JsonObject): unknown {
            const resolved = resolveSchema(schema, root);
            if (!resolved) return value;
            if (Array.isArray(value)) {
              return value.map((item) => omitUnexpectedNulls(item, resolved.items, root));
            }
            if (!object(value)) return value;
            const variants = Array.isArray(resolved.anyOf)
              ? resolved.anyOf
              : Array.isArray(resolved.oneOf)
                ? resolved.oneOf
                : [];
            if (variants.length) {
              return omitUnexpectedNulls(
                value,
                variants.find((variant) => !allowsNull(variant, root)),
                root,
              );
            }
            if (!object(resolved.properties)) return value;
            const cleaned: JsonObject = { ...value };
            const required = new Set(Array.isArray(resolved.required) ? resolved.required : []);
            for (const [key, propertySchema] of Object.entries(resolved.properties)) {
              const property = resolveSchema(propertySchema, root);
              if (!(key in cleaned)) {
                if (required.has(key) && property?.type === "array") cleaned[key] = [];
                continue;
              }
              if (cleaned[key] === null && !allowsNull(propertySchema, root)) {
                if (required.has(key) && property?.type === "array") cleaned[key] = [];
                else if (!required.has(key)) delete cleaned[key];
              } else {
                cleaned[key] = omitUnexpectedNulls(cleaned[key], propertySchema, root);
              }
            }
            return cleaned;
          }

          function exampleFromSchema(schema: unknown, root: JsonObject, depth = 0): unknown {
            if (depth > 8) return null;
            const resolved = resolveSchema(schema, root);
            if (!resolved) return null;
            if (Array.isArray(resolved.enum) && resolved.enum.length > 0) return resolved.enum[0];
            const variants = Array.isArray(resolved.anyOf)
              ? resolved.anyOf
              : Array.isArray(resolved.oneOf)
                ? resolved.oneOf
                : [];
            if (variants.length) {
              const nonNull = variants.find((variant) => !allowsNull(variant, root));
              return exampleFromSchema(nonNull ?? variants[0], root, depth + 1);
            }
            const type = Array.isArray(resolved.type)
              ? resolved.type.find((value) => value !== "null")
              : resolved.type;
            if (type === "object" || object(resolved.properties)) {
              const properties = object(resolved.properties) ? resolved.properties : {};
              const required = new Set(Array.isArray(resolved.required) ? resolved.required : []);
              return Object.fromEntries(
                Object.entries(properties)
                  .filter(([key]) => required.has(key))
                  .map(([key, value]) => [key, exampleFromSchema(value, root, depth + 1)]),
              );
            }
            if (type === "array") return [];
            if (type === "integer" || type === "number") return 0;
            if (type === "boolean") return false;
            if (type === "null") return null;
            return "<string>";
          }

          const DEEPSEEK_CHAT_COMPLETIONS_URL = "https://api.deepseek.com/chat/completions";

          export class AiProviderClient {
            constructor(private readonly config: AiProviderConfig) {}

            async generateStructured<T>(
              request: StructuredGenerationRequest<T>,
              retries = 1,
            ): Promise<StructuredGenerationResult<T>> {
              const policy = createModelPolicy({ task: request.task });
              const startedAt = Date.now();
              let lastError: unknown;

              for (let attempt = 1; attempt <= retries + 1; attempt += 1) {
                const attemptStartedAt = Date.now();
                try {
                  const result = await this.callDeepSeek(request, policy.temperature);
                  this.config.logger?.({
                    task: request.task,
                    provider: "deepseek",
                    model: DEEPSEEK_FLASH_MODEL,
                    attempt,
                    latencyMs: Date.now() - attemptStartedAt,
                    status: "success",
                  });
                  return {
                    ...result,
                    provider: "deepseek",
                    attempts: attempt,
                    latencyMs: Date.now() - startedAt,
                  };
                } catch (error) {
                  lastError = error;
                  const code = error instanceof AiProviderError ? error.code : "provider_failure";
                  this.config.logger?.({
                    task: request.task,
                    provider: "deepseek",
                    model: DEEPSEEK_FLASH_MODEL,
                    attempt,
                    latencyMs: Date.now() - attemptStartedAt,
                    status: "error",
                    errorCode: code,
                  });
                  if (!isTransientAiProviderError(error) || attempt > retries) throw error;
                }
              }
              throw lastError;
            }

            private async callDeepSeek<T>(
              request: StructuredGenerationRequest<T>,
              temperature: number,
            ): Promise<Omit<StructuredGenerationResult<T>, "provider" | "attempts" | "latencyMs">> {
              const apiKey = this.config.deepseekApiKey;
              if (!apiKey) {
                throw new AiProviderError("configuration", "DEEPSEEK_API_KEY is not configured.");
              }

              const timeoutSignal = AbortSignal.timeout(this.config.timeoutMs ?? 60_000);
              const signal = request.signal
                ? AbortSignal.any([request.signal, timeoutSignal])
                : timeoutSignal;
              const example = exampleFromSchema(request.jsonSchema.schema, request.jsonSchema.schema);
              const system = [
                request.system,
                "Return exactly one valid JSON object and no Markdown or explanatory text.",
                `JSON schema name: ${request.jsonSchema.name}`,
                request.jsonSchema.description
                  ? `JSON schema description: ${request.jsonSchema.description}`
                  : "",
                `JSON schema: ${JSON.stringify(request.jsonSchema.schema)}`,
                `Example JSON shape: ${JSON.stringify(example)}`,
                "Use the supplied facts for real values; do not copy placeholder example values.",
              ]
                .filter(Boolean)
                .join("\n\n");

              let response: Response;
              try {
                response = await fetch(DEEPSEEK_CHAT_COMPLETIONS_URL, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${apiKey}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    model: DEEPSEEK_FLASH_MODEL,
                    thinking: { type: "disabled" },
                    temperature,
                    max_tokens: 4096,
                    messages: [
                      { role: "system", content: system },
                      { role: "user", content: request.prompt },
                    ],
                    response_format: { type: "json_object" },
                  }),
                  signal,
                });
              } catch (error) {
                if (request.signal?.aborted) {
                  throw new AiProviderError("aborted", "DeepSeek request was aborted.", {
                    cause: error,
                  });
                }
                if (timeoutSignal.aborted) {
                  throw new AiProviderError("timeout", "DeepSeek request timed out.", {
                    cause: error,
                  });
                }
                throw new AiProviderError("provider_failure", "DeepSeek request failed.", {
                  cause: error,
                });
              }

              const responseText = await response.text();
              let payload: ProviderResponse;
              try {
                payload = JSON.parse(responseText) as ProviderResponse;
              } catch (error) {
                throw new AiProviderError(
                  "malformed_response",
                  `DeepSeek returned malformed JSON: ${responseText.slice(0, 500)}`,
                  { cause: error },
                );
              }

              if (!response.ok) {
                const code: AiProviderErrorCode =
                  response.status === 429
                    ? "rate_limited"
                    : response.status >= 500
                      ? "provider_failure"
                      : "provider_rejected";
                const providerMessage = payload.error?.message || responseText.slice(0, 500);
                throw new AiProviderError(
                  code,
                  `DeepSeek rejected the request (${response.status}): ${providerMessage}`,
                  { cause: payload.error },
                );
              }

              const choice = payload.choices?.[0];
              const content = choice?.message?.content;
              if (!content) {
                throw new AiProviderError(
                  "malformed_response",
                  `DeepSeek returned empty structured content (finish_reason=${choice?.finish_reason ?? "unknown"}).`,
                );
              }

              let decoded: unknown;
              try {
                decoded = JSON.parse(content);
                decoded = omitUnexpectedNulls(
                  decoded,
                  request.jsonSchema.schema,
                  request.jsonSchema.schema,
                );
              } catch (error) {
                throw new AiProviderError(
                  "malformed_response",
                  "DeepSeek returned invalid structured JSON.",
                  { cause: error },
                );
              }

              const validated = request.validator.safeParse(decoded);
              if (!validated.success) {
                throw new AiProviderError(
                  "validation",
                  `DeepSeek structured output failed validation: ${validated.error.message}`,
                );
              }

              return {
                data: validated.data,
                requestedModel: DEEPSEEK_FLASH_MODEL,
                actualModel: payload.model || DEEPSEEK_FLASH_MODEL,
                providerRequestId: payload.id,
              };
            }
          }
          '''
          ai_provider = re.sub(r'^          ', '', ai_provider, flags=re.MULTILINE)
          Path('packages/ai-gm/src/ai-provider.ts').write_text(ai_provider, encoding='utf-8')

          model_policy = r'''export type AiTask =
            | "parse_intent"
            | "normalize_content"
            | "analyze_consumable"
            | "propose_adjudication"
            | "plan_npc"
            | "summarize_memory"
            | "brainstorm_content"
            | "narrate_event"
            | "private_assistant";

          export type AiAuthority = "authoritative" | "creative";
          export const DEEPSEEK_FLASH_MODEL = "deepseek-v4-flash" as const;

          export interface ModelPolicy {
            task: AiTask;
            authority: AiAuthority;
            model: typeof DEEPSEEK_FLASH_MODEL;
            allowUserOverride: false;
            requireStructuredOutput: boolean;
            temperature: number;
          }

          const authoritativeTasks = new Set<AiTask>([
            "parse_intent",
            "normalize_content",
            "analyze_consumable",
            "propose_adjudication",
            "plan_npc",
            "summarize_memory",
          ]);

          export function createModelPolicy(input: {
            task: AiTask;
            authoritativeModel?: string;
            creativeModel?: string;
            requestedModel?: string;
          }): ModelPolicy {
            const authority: AiAuthority = authoritativeTasks.has(input.task)
              ? "authoritative"
              : "creative";
            return {
              task: input.task,
              authority,
              model: DEEPSEEK_FLASH_MODEL,
              allowUserOverride: false,
              requireStructuredOutput: authority === "authoritative" || input.task === "brainstorm_content",
              temperature: authority === "authoritative" ? 0.1 : 0.8,
            };
          }
          '''
          model_policy = re.sub(r'^          ', '', model_policy, flags=re.MULTILINE)
          Path('packages/ai-gm/src/model-policy.ts').write_text(model_policy, encoding='utf-8')

          Path('packages/ai-gm/src/index.ts').write_text(
              'export * from "./action-adjudicator.js";\n'
              'export * from "./ai-provider.js";\n'
              'export * from "./consumable-analyzer.js";\n'
              'export * from "./content-normalizer.js";\n'
              'export * from "./conversation-adjudicator.js";\n'
              'export * from "./model-policy.js";\n',
              encoding='utf-8',
          )

          for obsolete in [
              Path('packages/ai-gm/src/openrouter.ts'),
              Path('packages/ai-gm/src/openrouter.test.ts'),
          ]:
              if obsolete.exists():
                  obsolete.unlink()

          code_suffixes = {'.ts', '.tsx', '.mts', '.cts'}
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix not in code_suffixes:
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('OpenRouterClient', 'AiProviderClient')
              text = text.replace('OpenRouterErrorCode', 'AiProviderErrorCode')
              text = text.replace('OpenRouterError', 'AiProviderError')
              text = text.replace('OpenRouterConfig', 'AiProviderConfig')
              text = text.replace('./openrouter.js', './ai-provider.js')
              text = text.replace('deepseek-v4-pro', 'deepseek-v4-flash')
              path.write_text(text, encoding='utf-8')

          def replace_exact(path_str, old, new):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path_str}: {old[:120]!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'apps/api/src/action-service.ts',
              '''  const client = new AiProviderClient({
              apiKey: environment.OPENROUTER_API_KEY,
              deepseekApiKey: environment.DEEPSEEK_API_KEY,
              baseUrl: environment.OPENROUTER_BASE_URL,
              httpReferer: environment.OPENROUTER_HTTP_REFERER,
              appName: environment.OPENROUTER_APP_NAME,
              fallbackModel: environment.OPENROUTER_FALLBACK_MODEL,
              authoritativeModel: environment.AI_AUTHORITATIVE_MODEL || environment.DEEPSEEK_MODEL,
              creativeModel: environment.AI_CREATIVE_MODEL || environment.DEEPSEEK_MODEL,
            });
            const aiConfigured = Boolean(environment.DEEPSEEK_API_KEY || environment.OPENROUTER_API_KEY);'''.replace('            ', ''),
              '''  const client = new AiProviderClient({
                deepseekApiKey: environment.DEEPSEEK_API_KEY,
              });
              const aiConfigured = Boolean(environment.DEEPSEEK_API_KEY);'''.replace('              ', ''),
          )
          replace_exact(
              'apps/api/src/action-service.ts',
              '''        !environment.OPENROUTER_API_KEY &&
                !environment.DEEPSEEK_API_KEY &&'''.replace('        ', ''),
              '''        !environment.DEEPSEEK_API_KEY &&'''.replace('        ', ''),
          )
          action_path = Path('apps/api/src/action-service.ts')
          action_text = action_path.read_text(encoding='utf-8')
          action_text = action_text.replace(
              '  CONSUMABLE_ANALYSIS_POLICY_VERSION,\n',
              '  CONSUMABLE_ANALYSIS_POLICY_VERSION,\n  DEEPSEEK_FLASH_MODEL,\n',
          )
          action_text = action_text.replace(
              'environment.AI_AUTHORITATIVE_MODEL || environment.DEEPSEEK_MODEL || "configured"',
              'DEEPSEEK_FLASH_MODEL',
          )
          action_text = action_text.replace(
              'environment.AI_CREATIVE_MODEL || environment.DEEPSEEK_MODEL || "configured"',
              'DEEPSEEK_FLASH_MODEL',
          )
          action_path.write_text(action_text, encoding='utf-8')

          invention_path = Path('apps/api/src/invention-service.ts')
          invention_text = invention_path.read_text(encoding='utf-8')
          invention_text = invention_text.replace(
              '  CONTENT_NORMALIZATION_POLICY_VERSION,\n',
              '  CONTENT_NORMALIZATION_POLICY_VERSION,\n  DEEPSEEK_FLASH_MODEL,\n',
          )
          invention_text = re.sub(
              r'function requestedModel\(environment: NodeJS\.ProcessEnv\): string \{.*?\n\}',
              'function requestedModel(): string {\n  return DEEPSEEK_FLASH_MODEL;\n}',
              invention_text,
              flags=re.S,
          )
          invention_text = invention_text.replace('requestedModel(environment)', 'requestedModel()')
          invention_text = re.sub(
              r'  const client = new AiProviderClient\(\{.*?\n  \}\);',
              '  const client = new AiProviderClient({\n    deepseekApiKey: environment.DEEPSEEK_API_KEY,\n  });',
              invention_text,
              count=1,
              flags=re.S,
          )
          invention_text = invention_text.replace(
              'metadata: { requestId, characterId: input.characterId, provider: environment.DEEPSEEK_API_KEY ? "deepseek" : "openrouter" },',
              'metadata: { requestId, characterId: input.characterId, provider: "deepseek" },',
          )
          invention_text = invention_text.replace(
              'Boolean(environment.DEEPSEEK_API_KEY || environment.OPENROUTER_API_KEY)',
              'Boolean(environment.DEEPSEEK_API_KEY)',
          )
          invention_path.write_text(invention_text, encoding='utf-8')

          app_path = Path('apps/api/src/app.ts')
          app_text = app_path.read_text(encoding='utf-8')
          app_text = app_text.replace(
              'import { AiProviderClient, createModelPolicy } from "@nocturne/ai-gm";',
              'import { AiProviderClient, DEEPSEEK_FLASH_MODEL, createModelPolicy } from "@nocturne/ai-gm";',
          )
          app_text = re.sub(
              r'    client: new AiProviderClient\(\{.*?\n    \}\),',
              '    client: new AiProviderClient({\n      deepseekApiKey: process.env.DEEPSEEK_API_KEY,\n    }),',
              app_text,
              count=1,
              flags=re.S,
          )
          app_text = re.sub(
              r'  const primaryProvider = process\.env\.DEEPSEEK_API_KEY \? "deepseek" : "openrouter";.*?\n\n  app\.get\("/health",',
              '  const primaryProvider = "deepseek" as const;\n  const primaryConfigured = Boolean(process.env.DEEPSEEK_API_KEY);\n\n  app.get("/health",',
              app_text,
              count=1,
              flags=re.S,
          )
          app_text = app_text.replace(
              '      fallbackConfigured,\n',
              '      model: DEEPSEEK_FLASH_MODEL,\n',
          )
          app_text = app_text.replace(
              '      fallbackConfigured,\n',
              '      model: DEEPSEEK_FLASH_MODEL,\n',
          )
          app_text = app_text.replace(
              '''    authoritative: createModelPolicy({
                  task: "parse_intent",
                  authoritativeModel: process.env.AI_AUTHORITATIVE_MODEL || process.env.DEEPSEEK_MODEL,
                }),
                creative: createModelPolicy({
                  task: "narrate_event",
                  creativeModel: process.env.AI_CREATIVE_MODEL || process.env.DEEPSEEK_MODEL,
                }),'''.replace('                ', ''),
              '''    authoritative: createModelPolicy({ task: "parse_intent" }),
                creative: createModelPolicy({ task: "narrate_event" }),'''.replace('                ', ''),
          )
          app_path.write_text(app_text, encoding='utf-8')

          # Remove legacy provider environment variables from examples and prose.
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.name.startswith('.env') or path.suffix in {'.md', '.txt'}:
                  try:
                      lines = path.read_text(encoding='utf-8').splitlines()
                  except UnicodeDecodeError:
                      continue
                  cleaned = [line for line in lines if 'openrouter' not in line.lower()]
                  path.write_text('\n'.join(cleaned) + ('\n' if lines else ''), encoding='utf-8')

          test_content = r'''import { afterEach, describe, expect, it, vi } from "vitest";
          import { z } from "zod";
          import { AiProviderClient, DEEPSEEK_FLASH_MODEL } from "./index.js";

          afterEach(() => {
            vi.unstubAllGlobals();
          });

          describe("AiProviderClient DeepSeek Flash request", () => {
            it("uses only the direct DeepSeek Flash JSON endpoint and disables thinking", async () => {
              const fetchMock = vi.fn<typeof fetch>().mockResolvedValue(
                new Response(
                  JSON.stringify({
                    id: "deepseek-valid",
                    model: DEEPSEEK_FLASH_MODEL,
                    choices: [
                      {
                        finish_reason: "stop",
                        message: { content: JSON.stringify({ value: "ok" }) },
                      },
                    ],
                  }),
                  { status: 200, headers: { "Content-Type": "application/json" } },
                ),
              );
              vi.stubGlobal("fetch", fetchMock);

              const client = new AiProviderClient({ deepseekApiKey: "deepseek-test-key" });
              const result = await client.generateStructured({
                task: "parse_intent",
                system: "Return the requested object.",
                prompt: "Return value ok.",
                jsonSchema: {
                  name: "test_schema",
                  schema: {
                    type: "object",
                    additionalProperties: false,
                    required: ["value"],
                    properties: { value: { type: "string" } },
                  },
                },
                validator: z.object({ value: z.string() }),
              });

              expect(result.data).toEqual({ value: "ok" });
              expect(result.provider).toBe("deepseek");
              expect(result.requestedModel).toBe(DEEPSEEK_FLASH_MODEL);
              expect(fetchMock).toHaveBeenCalledTimes(1);
              const [url, init] = fetchMock.mock.calls[0]!;
              expect(url).toBe("https://api.deepseek.com/chat/completions");
              const headers = init?.headers as Record<string, string>;
              expect(headers.Authorization).toBe("Bearer deepseek-test-key");
              const body = JSON.parse(String(init?.body));
              expect(body.model).toBe(DEEPSEEK_FLASH_MODEL);
              expect(body.thinking).toEqual({ type: "disabled" });
              expect(body.response_format).toEqual({ type: "json_object" });
              expect(body).not.toHaveProperty("plugins");
              expect(body).not.toHaveProperty("provider");
              expect(body.messages[0].content).toContain("Example JSON shape");
            });
          });
          '''
          test_content = re.sub(r'^          ', '', test_content, flags=re.MULTILINE)
          Path('packages/ai-gm/src/ai-provider.test.ts').write_text(test_content, encoding='utf-8')

          # Normalize any remaining test fixtures and verify no provider fallback survives.
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix in code_suffixes:
                  text = path.read_text(encoding='utf-8')
                  text = text.replace('OPENROUTER_API_KEY', 'DEEPSEEK_API_KEY')
                  text = text.replace('"openrouter"', '"deepseek"')
                  text = text.replace("'openrouter'", "'deepseek'")
                  text = text.replace('deepseek-v4-pro', 'deepseek-v4-flash')
                  path.write_text(text, encoding='utf-8')

          remaining = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if 'openrouter' in text.lower() or 'deepseek-v4-pro' in text.lower():
                  remaining.append(str(path))
          if remaining:
              raise SystemExit(f'Legacy provider references remain: {remaining}')
          PY
      - name: Commit codemod
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/deepseek-flash-codemod.yml
          git add -A
          git commit -m "fix: use DeepSeek Flash directly"
          git push origin HEAD:fix/deepseek-flash-only
