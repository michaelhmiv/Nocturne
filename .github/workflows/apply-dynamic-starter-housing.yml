name: Apply Dynamic Starter Housing

on:
  push:
    branches:
      - feat/dynamic-starter-housing-v2
    paths:
      - "scripts/ci/apply-dynamic-starter-housing.mjs"
      - "packages/database/migrations/0012_dynamic_starter_housing.sql"
      - ".github/workflows/apply-dynamic-starter-housing.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dynamic-starter-housing-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply onboarding refactor
        run: node scripts/ci/apply-dynamic-starter-housing.mjs
      - name: Format changed source files
        run: >-
          pnpm exec prettier --write
          scripts/ci/apply-dynamic-starter-housing.mjs
          packages/database/src/game-store.ts
          packages/contracts/src/character.ts
          apps/api/test/persistent-world.test.ts
          apps/web/app/scene-game-client.tsx
          apps/mcp/src/tools.ts
          docs/operations/nocturne-mcp.md
      - name: Verify repository
        run: pnpm verify
      - name: Commit verified implementation
        run: |
          rm scripts/ci/apply-dynamic-starter-housing.mjs
          rm .github/workflows/apply-dynamic-starter-housing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: provision unique bare-bones starter apartments"
          git push origin HEAD:feat/dynamic-starter-housing-v2
