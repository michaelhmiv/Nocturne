name: Dashboard Hotfix Formatter

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact repository formatting
        run: |
          pnpm exec prettier --write \
            packages/database/src/operator-dashboard-store.ts \
            packages/database/src/timestamp.test.ts \
            packages/database/src/timestamp.ts \
            test/browser/gameplay.spec.mjs
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/database/src/operator-dashboard-store.ts \
            packages/database/src/timestamp.test.ts \
            packages/database/src/timestamp.ts \
            test/browser/gameplay.spec.mjs
          git commit -m "style: apply repository formatting"
          git push origin HEAD:${{ github.head_ref }}
