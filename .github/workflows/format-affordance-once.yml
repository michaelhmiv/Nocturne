name: Format Action Affordance Once

on:
  push:
    branches:
      - feat/action-affordance-evaluation-v2
    paths:
      - ".github/workflows/format-affordance-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/action-affordance-evaluation-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and verify
        run: |
          pnpm exec prettier --write apps/api/src/action-affordance-evaluator.ts apps/api/src/action-affordance-evaluator.test.ts
          rm .github/workflows/format-affordance-once.yml
          pnpm --filter @nocturne/api test
          pnpm typecheck
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format action affordance evaluation"
          git push origin HEAD:feat/action-affordance-evaluation-v2
