name: One-time formatting repair

on:
  push:
    branches:
      - fix/production-provider-hardening-and-secret-audit

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-provider-hardening-and-secret-audit
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/ai-gm/src/ai-provider.ts packages/ai-gm/src/ai-provider.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/ai-gm/src/ai-provider.ts packages/ai-gm/src/ai-provider.test.ts
          git commit -m "style: format provider hardening"
          git push origin HEAD:fix/production-provider-hardening-and-secret-audit
