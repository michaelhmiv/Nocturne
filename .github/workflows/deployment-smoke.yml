name: Production Deployment Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Nocturne Certification
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: production-deployment-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    name: Deployment / Live Provider Gameplay Smoke
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOCTURNE_API_URL: ${{ vars.NOCTURNE_API_URL || 'https://nocturneapi-production.up.railway.app' }}
      NOCTURNE_WEB_URL: ${{ vars.NOCTURNE_WEB_URL || 'https://nocturneweb-production.up.railway.app' }}
      NOCTURNE_SMOKE_AGENT_TOKEN: ${{ secrets.NOCTURNE_SMOKE_AGENT_TOKEN }}
      NOCTURNE_SMOKE_CHARACTER_ID: ${{ vars.NOCTURNE_SMOKE_CHARACTER_ID }}
      NOCTURNE_SMOKE_GUEST_MODE: ${{ vars.NOCTURNE_SMOKE_GUEST_MODE || 'true' }}
      EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Execute live provider gameplay smoke
        run: |
          mkdir -p artifacts
          set -o pipefail
          pnpm exec tsx scripts/ci/production-smoke.ts 2>&1 | tee artifacts/production-smoke.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
