name: Patch Scheduled Work Idempotency

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-scheduled-work-idempotency
  cancel-in-progress: true

jobs:
  patch:
    name: Patch / Scheduled Work Idempotency
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ci/exhaustive-gameplay-certification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/exhaustive-gameplay-certification
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add deterministic child idempotency key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("packages/database/src/universal-operation-executor.ts")
          source = path.read_text()

          if "schedule_id, idempotency_key, intent_id" in source:
              print("Scheduled work idempotency is already patched.")
              raise SystemExit(0)

          columns_pattern = re.compile(
              r"schedule_id,\s*intent_id,\s*world_id,\s*shard_id,\s*resolves_at,\s*status,\s*"
              r"kind,\s*payload,\s*source_event_id,\s*subject_entity_ids,\s*"
              r"expected_versions,\s*resolution_policy",
              re.DOTALL,
          )
          source, column_count = columns_pattern.subn(
              "schedule_id, idempotency_key, intent_id, world_id, shard_id,\n"
              "                  resolves_at, status, kind, payload, source_event_id,\n"
              "                  subject_entity_ids, expected_versions, resolution_policy",
              source,
              count=1,
          )
          if column_count != 1:
              raise SystemExit(f"Expected one scheduled work insert column list; found {column_count}")

          values_pattern = re.compile(
              r"\$\{scheduleId\},\s*\$\{input\.sourceIntentId \|\| null\},\s*"
              r"\$\{input\.scope\.worldId\},\s*\$\{input\.scope\.shardId\},\s*"
              r"\$\{resolvesAt\.toISOString\(\)\},\s*'pending',\s*"
              r"\$\{operation\.kind\},\s*\$\{json\(payload\)\}::jsonb,\s*\$\{eventId\},",
              re.DOTALL,
          )
          source, value_count = values_pattern.subn(
              "${scheduleId}, ${`${input.idempotencyKey}:schedule:${order}`},\n"
              "                  ${input.sourceIntentId || null}, ${input.scope.worldId},\n"
              "                  ${input.scope.shardId}, ${resolvesAt.toISOString()}, 'pending',\n"
              "                  ${operation.kind}, ${json(payload)}::jsonb, ${eventId},",
              source,
              count=1,
          )
          if value_count != 1:
              raise SystemExit(f"Expected one scheduled work insert value list; found {value_count}")

          path.write_text(source)
          PY
          pnpm exec prettier --write packages/database/src/universal-operation-executor.ts
          pnpm --filter @nocturne/database typecheck
      - name: Commit scheduled work correction
        run: |
          if git diff --quiet; then
            echo "Scheduled work idempotency is already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/universal-operation-executor.ts
          git commit -m "fix: persist scheduled work idempotency keys"
          git push origin HEAD:ci/exhaustive-gameplay-certification
