name: Format Semantic Action Once

on:
  push:
    branches:
      - feat/semantic-action-frame
    paths:
      - "apps/api/src/semantic-action-frame.ts"
      - "apps/api/src/world-action-handler-registry.ts"
      - ".github/workflows/format-semantic-action-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/semantic-action-frame
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format files
        run: |
          pnpm exec prettier --write apps/api/src/semantic-action-frame.ts apps/api/src/world-action-handler-registry.ts
          rm .github/workflows/format-semantic-action-once.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/semantic-action-frame.ts apps/api/src/world-action-handler-registry.ts .github/workflows/format-semantic-action-once.yml
          git commit -m "style: format semantic action runtime"
          git push origin HEAD:feat/semantic-action-frame
