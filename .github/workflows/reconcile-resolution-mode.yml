name: Reconcile Resolution Mode

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/reconcile-resolution-mode.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resolution-mode-adjudicator
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Merge main and format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
          pnpm exec prettier --write apps/api/src/resolution-mode-adjudicator.test.ts apps/api/src/resolution-mode-adjudicator.ts apps/api/src/routine-action-service.ts apps/api/src/semantic-action-frame.test.ts packages/contracts/src/semantic-action.ts
          rm -f .github/workflows/reconcile-resolution-mode.yml .github/workflows/repair-resolution-mode-branch.yml
          git add -A
          git commit --amend --no-edit
          pnpm --filter @nocturne/api test
          pnpm typecheck
          git push origin HEAD:feat/resolution-mode-adjudicator
