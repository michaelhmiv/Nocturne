# One-shot branch repair; remove after the store correction lands.
name: Patch Consumption Analysis Quantity

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-consumption-analysis-quantity
  cancel-in-progress: true

jobs:
  patch:
    name: Patch / Consumption Analysis Quantity
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ci/exhaustive-gameplay-certification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/exhaustive-gameplay-certification
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Saturate AI-facing candidate quantities
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/database/src/consumption-store.ts")
          source = path.read_text()

          entity_old = '''        quantity,
        state,
        constraints: arrayOfStrings(state.constraints),
          '''
          entity_new = '''        quantity: Math.min(quantity, 1_000),
        state,
        constraints: arrayOfStrings(state.constraints),
          '''
          pool_old = '''          quantity: numeric(row.units_remaining, 0),
          state: object(row.state),
          '''
          pool_new = '''          quantity: Math.min(numeric(row.units_remaining, 0), 1_000),
          state: object(row.state),
          '''

          already = (
              "quantity: Math.min(quantity, 1_000)" in source
              and "quantity: Math.min(numeric(row.units_remaining, 0), 1_000)" in source
          )
          if already:
              print("Consumption analysis quantities are already saturated.")
              raise SystemExit(0)
          if entity_old not in source:
              raise SystemExit("Entity candidate quantity block was not found")
          if pool_old not in source:
              raise SystemExit("Ambient pool quantity block was not found")

          source = source.replace(entity_old, entity_new, 1)
          source = source.replace(pool_old, pool_new, 1)
          path.write_text(source)
          PY
          pnpm exec prettier --write packages/database/src/consumption-store.ts
          pnpm --filter @nocturne/database typecheck
      - name: Commit quantity boundary correction
        run: |
          if git diff --quiet; then
            echo "Consumption quantities are already bounded."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/consumption-store.ts
          git commit -m "fix: bound AI-facing consumption quantities"
          git push origin HEAD:ci/exhaustive-gameplay-certification
