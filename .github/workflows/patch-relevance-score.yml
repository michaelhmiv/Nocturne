name: Patch Relevance Score Saturation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-relevance-score-saturation
  cancel-in-progress: true

jobs:
  patch:
    name: Patch / Relevance Score Saturation
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ci/exhaustive-gameplay-certification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/exhaustive-gameplay-certification
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Saturate accumulated relevance scores
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("packages/database/src/relevance-context-store.ts")
          source = path.read_text()

          if "const boundedRelevanceScore" not in source:
              anchor = "function addCandidate(\n"
              index = source.index(anchor)
              helper = (
                  "const boundedRelevanceScore = (score: number) =>\n"
                  "  Math.max(-100_000, Math.min(100_000, score));\n\n"
              )
              source = source[:index] + helper + source[index:]

          source, accumulation_count = re.subn(
              r"current\.score\s*\+=\s*score;",
              "current.score = boundedRelevanceScore(current.score + score);",
              source,
              count=1,
          )
          source, initial_count = re.subn(
              r"(candidates\.set\(entityId,\s*\{\s*entityId,\s*)score,",
              r"\1score: boundedRelevanceScore(score),",
              source,
              count=1,
              flags=re.DOTALL,
          )

          if accumulation_count != 1 and "current.score = boundedRelevanceScore" not in source:
              raise SystemExit("Could not patch accumulated relevance score")
          if initial_count != 1 and "score: boundedRelevanceScore(score)" not in source:
              raise SystemExit("Could not patch initial relevance score")

          path.write_text(source)
          PY
          pnpm exec prettier --write packages/database/src/relevance-context-store.ts
          pnpm --filter @nocturne/database typecheck
      - name: Commit relevance correction
        run: |
          if git diff --quiet; then
            echo "Relevance scores are already saturated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/relevance-context-store.ts
          git commit -m "fix: saturate accumulated relevance scores"
          git push origin HEAD:ci/exhaustive-gameplay-certification
