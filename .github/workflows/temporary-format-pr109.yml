name: Temporary PR 109 Formatter

on:
  push:
    branches:
      - fix/authoritative-action-guards

permissions:
  contents: write

concurrency:
  group: temporary-format-pr109
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/authoritative-action-guards
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed implementation files
        run: >-
          pnpm exec prettier --write
          apps/api/src/action-affordance-evaluator.ts
          apps/api/src/semantic-action-execution-service.ts
          apps/api/src/semantic-action-frame.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/action-affordance-evaluator.ts \
                  apps/api/src/semantic-action-execution-service.ts \
                  apps/api/src/semantic-action-frame.ts
          git commit -m "style: format authoritative action guards"
          git push origin HEAD:fix/authoritative-action-guards
