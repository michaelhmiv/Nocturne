name: Temporary PR 109 Formatter

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: temporary-format-pr109-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed implementation files
        run: >-
          pnpm exec prettier --write
          apps/api/src/action-affordance-evaluator.ts
          apps/api/src/semantic-action-execution-service.ts
          apps/api/src/semantic-action-frame.ts
      - uses: actions/upload-artifact@v4
        with:
          name: pr109-formatted-source
          path: |
            apps/api/src/action-affordance-evaluator.ts
            apps/api/src/semantic-action-execution-service.ts
            apps/api/src/semantic-action-frame.ts
          retention-days: 1
