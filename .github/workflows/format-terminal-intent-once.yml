name: One-time terminal intent formatting

on:
  push:
    branches:
      - feat/terminal-intent-planner

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/terminal-intent-planner
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          packages/ai-gm/src/affordance-adjudicator.ts
          packages/ai-gm/src/affordance-adjudicator.test.ts
          packages/ai-gm/src/persistent-world-planner.ts
          packages/ai-gm/src/persistent-world-planner.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/ai-gm/src/affordance-adjudicator.ts packages/ai-gm/src/affordance-adjudicator.test.ts packages/ai-gm/src/persistent-world-planner.ts packages/ai-gm/src/persistent-world-planner.test.ts
          git commit -m "style: format terminal intent implementation"
          git push origin HEAD:feat/terminal-intent-planner
