name: Format Baseline Autofix

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-baseline-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format / Normalize Baseline
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ci/exhaustive-gameplay-certification'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/exhaustive-gameplay-certification
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize all tracked source formatting
        run: pnpm format
      - name: Commit normalized baseline
        run: |
          if git diff --quiet; then
            echo "Formatting baseline is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: normalize repository formatting baseline"
          git push origin HEAD:ci/exhaustive-gameplay-certification
