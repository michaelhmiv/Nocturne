name: Prettier Artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format action refactor files
        run: |
          pnpm exec prettier --write apps/api/src/resolution-mode-adjudicator.test.ts apps/api/src/resolution-mode-adjudicator.ts apps/api/src/routine-action-service.ts apps/api/src/semantic-action-frame.test.ts packages/contracts/src/semantic-action.ts
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-action-refactor
          path: |
            apps/api/src/resolution-mode-adjudicator.test.ts
            apps/api/src/resolution-mode-adjudicator.ts
            apps/api/src/routine-action-service.ts
            apps/api/src/semantic-action-frame.test.ts
            packages/contracts/src/semantic-action.ts
