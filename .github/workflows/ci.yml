name: Nocturne Certification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certification-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  PNPM_VERSION: 11.17.0
  NODE_VERSION: 22

jobs:
  format:
    name: Certification / Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: |
          mkdir -p artifacts
          set -o pipefail
          pnpm format:check 2>&1 | tee artifacts/format.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: format-${{ github.run_id }}
          path: artifacts/

  typecheck:
    name: Certification / Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: |
          mkdir -p artifacts
          set -o pipefail
          pnpm typecheck 2>&1 | tee artifacts/typecheck.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-${{ github.run_id }}
          path: artifacts/

  unit:
    name: Certification / Unit and Telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run package tests
        run: |
          mkdir -p artifacts
          set -o pipefail
          pnpm test 2>&1 | tee artifacts/unit.log
      - name: Run capability and telemetry contracts
        run: |
          set -o pipefail
          pnpm test:capabilities 2>&1 | tee artifacts/capabilities.log
          pnpm test:telemetry 2>&1 | tee artifacts/telemetry.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-${{ github.run_id }}
          path: artifacts/

  build:
    name: Certification / Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build every workspace package
        run: |
          mkdir -p artifacts
          set -o pipefail
          pnpm build 2>&1 | tee artifacts/build.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_id }}
          path: artifacts/

  database:
    name: Certification / Database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nocturne_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nocturne_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nocturne_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate migration files
        run: pnpm db:check
      - name: Apply complete migration chain
        run: |
          mkdir -p artifacts
          set -o pipefail
          pnpm db:migrate 2>&1 | tee artifacts/migrate-first.log
      - name: Verify retry-safe migration runner
        run: |
          set -o pipefail
          pnpm db:migrate 2>&1 | tee artifacts/migrate-second.log
      - name: Check authoritative invariants
        run: |
          set -o pipefail
          pnpm --filter @nocturne/database db:invariants 2>&1 | tee artifacts/invariants.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-${{ github.run_id }}
          path: artifacts/

  action-matrix:
    name: Certification / Action Matrix ${{ matrix.shard + 1 }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      ACTION_MATRIX_SHARD_INDEX: ${{ matrix.shard }}
      ACTION_MATRIX_SHARD_TOTAL: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run exhaustive action shard
        run: |
          mkdir -p artifacts
          set -o pipefail
          pnpm test:action-matrix 2>&1 | tee artifacts/action-matrix-${{ matrix.shard }}.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: action-matrix-${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/

  required-gate:
    name: Certification / Required Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - format
      - typecheck
      - unit
      - build
      - database
      - action-matrix
    steps:
      - name: Require every certification job
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          ACTION_MATRIX_RESULT: ${{ needs.action-matrix.result }}
        run: |
          for result in \
            "$FORMAT_RESULT" \
            "$TYPECHECK_RESULT" \
            "$UNIT_RESULT" \
            "$BUILD_RESULT" \
            "$DATABASE_RESULT" \
            "$ACTION_MATRIX_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Certification dependency failed, was cancelled, or was skipped: $result"
              exit 1
            fi
          done
          echo "All required Nocturne certification jobs passed."
