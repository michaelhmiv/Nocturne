name: Temporary PR 111 Formatter

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          apps/api/src/operator-dashboard-routes.ts
          apps/api/src/operator-dashboard-routes.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: pr111-formatted-source
          path: |
            apps/api/src/operator-dashboard-routes.ts
            apps/api/src/operator-dashboard-routes.test.ts
          retention-days: 1
