name: PR20 bound-character patch

on:
  push:
    branches:
      - feat/security-ownership

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/security-ownership
          fetch-depth: 0

      - name: Enforce bound character after body validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/app.ts")
          text = path.read_text()

          replacements = [
              (
                  '''  app.post("/v1/market/listings", async (request, reply) => {
    await authorizeAgent(request.headers, "market:trade");
    const user = await requireUser(request.headers);
    const body = z
      .object({
        sellerId: z.string().uuid(),
        title: z.string().min(1).max(200),
        description: z.string().max(2000).optional(),
        priceCents: z.number().int().min(0),
        itemInstanceId: z.string().uuid().optional(),
      })
      .parse(request.body);
    await requireOwnedCharacter(user.id, body.sellerId);''',
                  '''  app.post("/v1/market/listings", async (request, reply) => {
    const body = z
      .object({
        sellerId: z.string().uuid(),
        title: z.string().min(1).max(200),
        description: z.string().max(2000).optional(),
        priceCents: z.number().int().min(0),
        itemInstanceId: z.string().uuid().optional(),
      })
      .parse(request.body);
    await authorizeAgent(request.headers, "market:trade", body.sellerId);
    const user = await requireUser(request.headers);
    await requireOwnedCharacter(user.id, body.sellerId);''',
              ),
              (
                  '''  app.post("/v1/market/buy", async (request) => {
    await authorizeAgent(request.headers, "market:trade");
    requireIdempotencyKey(request.headers);
    const user = await requireUser(request.headers);
    const body = z
      .object({ buyerId: z.string().uuid(), listingId: z.string().uuid() })
      .parse(request.body);
    await requireOwnedCharacter(user.id, body.buyerId);''',
                  '''  app.post("/v1/market/buy", async (request) => {
    requireIdempotencyKey(request.headers);
    const body = z
      .object({ buyerId: z.string().uuid(), listingId: z.string().uuid() })
      .parse(request.body);
    await authorizeAgent(request.headers, "market:trade", body.buyerId);
    const user = await requireUser(request.headers);
    await requireOwnedCharacter(user.id, body.buyerId);''',
              ),
              (
                  '''  app.post("/v1/market/cancel", async (request) => {
    await authorizeAgent(request.headers, "market:trade");
    const user = await requireUser(request.headers);
    const body = z
      .object({ sellerId: z.string().uuid(), listingId: z.string().uuid() })
      .parse(request.body);
    await requireOwnedCharacter(user.id, body.sellerId);''',
                  '''  app.post("/v1/market/cancel", async (request) => {
    const body = z
      .object({ sellerId: z.string().uuid(), listingId: z.string().uuid() })
      .parse(request.body);
    await authorizeAgent(request.headers, "market:trade", body.sellerId);
    const user = await requireUser(request.headers);
    await requireOwnedCharacter(user.id, body.sellerId);''',
              ),
              (
                  '''  app.post("/v1/vehicles/claim", async (request, reply) => {
    await authorizeAgent(request.headers, "vehicle:claim");
    requireIdempotencyKey(request.headers);
    const user = await requireUser(request.headers);
    const body = z
      .object({ ownerId: z.string().uuid(), vehicleId: z.string().uuid() })
      .parse(request.body);
    await requireOwnedCharacter(user.id, body.ownerId);''',
                  '''  app.post("/v1/vehicles/claim", async (request, reply) => {
    requireIdempotencyKey(request.headers);
    const body = z
      .object({ ownerId: z.string().uuid(), vehicleId: z.string().uuid() })
      .parse(request.body);
    await authorizeAgent(request.headers, "vehicle:claim", body.ownerId);
    const user = await requireUser(request.headers);
    await requireOwnedCharacter(user.id, body.ownerId);''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one exact match, found {count}")
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts
          git commit -m "fix: enforce bound characters on market and vehicle writes"
          git push origin HEAD:feat/security-ownership
