name: Repair PR 112 typed resources

on:
  push:
    branches:
      - fix/typed-resource-integrity
    paths:
      - .github/workflows/repair-pr112.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typed-resource-integrity
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply typed resource repairs
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          replacements = {
              Path('packages/database/src/consumption-store.ts'): [
                  ('resource: "consumable_units", amount: consumption.unitsConsumed',
                   'resource: "quantity" as const, amount: consumption.unitsConsumed'),
              ],
              Path('packages/database/src/lazy-simulation-store.ts'): [
                  ('import { LazySimulationResultSchema } from "@nocturne/contracts";',
                   'import { LazySimulationResultSchema, SystemResourceKeySchema } from "@nocturne/contracts";'),
                  ('resourceKeys: entity.resource_keys || [],',
                   'resourceKeys: SystemResourceKeySchema.array().parse(entity.resource_keys || []),'),
              ],
              Path('test/capabilities/dashboard-effect-consistency.test.ts'): [
                  ('satiety', 'nutrition'),
                  ('Satiety', 'Nutrition'),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Format changed files
        run: pnpm exec prettier --write packages/database/src/consumption-store.ts packages/database/src/lazy-simulation-store.ts packages/ai-gm/src/action-adjudicator.test.ts packages/ai-gm/src/lazy-simulation-analyzer.test.ts test/capabilities/dashboard-effect-consistency.test.ts
      - name: Verify targeted gates
        run: |
          pnpm typecheck
          pnpm test:capabilities
          pnpm format:check
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/consumption-store.ts packages/database/src/lazy-simulation-store.ts packages/ai-gm/src/action-adjudicator.test.ts packages/ai-gm/src/lazy-simulation-analyzer.test.ts test/capabilities/dashboard-effect-consistency.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: complete typed resource integration"
          git push origin HEAD:fix/typed-resource-integrity
