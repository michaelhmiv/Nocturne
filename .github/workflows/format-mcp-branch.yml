name: Format MCP Branch

on:
  push:
    branches:
      - feat/nocturne-mcp-service
    paths:
      - "apps/mcp/**"
      - "test/mcp-server.test.ts"
      - ".github/workflows/format-mcp-branch.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nocturne-mcp-service
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format MCP files
        run: >-
          pnpm exec prettier --write
          apps/mcp/src/config.ts
          apps/mcp/src/oauth.ts
          apps/mcp/src/tools.ts
          test/mcp-server.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mcp/src/config.ts apps/mcp/src/oauth.ts apps/mcp/src/tools.ts test/mcp-server.test.ts
          git commit -m "style: format MCP service"
          git push origin HEAD:feat/nocturne-mcp-service
