name: Repair PR 112 resource schema export

on:
  push:
    branches:
      - fix/typed-resource-integrity
    paths:
      - .github/workflows/repair-pr112-export.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/typed-resource-integrity
          fetch-depth: 0
      - name: Correct exported schema name
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('packages/database/src/lazy-simulation-store.ts')
          text = path.read_text()
          old = 'SystemResourceKeySchema'
          if old not in text:
              raise SystemExit(f'Expected {old} in {path}')
          path.write_text(text.replace(old, 'WorldResourceKeySchema'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/lazy-simulation-store.ts
          git commit -m "fix: use exported world resource schema"
          git push origin HEAD:fix/typed-resource-integrity
