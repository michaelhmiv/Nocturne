# One-shot branch repair; remove after the executor commit lands.
name: Patch Immutable Event Finalization

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-immutable-event-finalization
  cancel-in-progress: true

jobs:
  patch:
    name: Patch / Immutable Event Finalization
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ci/exhaustive-gameplay-certification'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/exhaustive-gameplay-certification
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace two-phase event mutation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("packages/database/src/universal-operation-executor.ts")
          source = path.read_text()

          if "immutableEventPayload" in source and "UPDATE game.event_ledger" not in source:
              print("Immutable event finalization is already patched.")
              raise SystemExit(0)

          involved_start = source.index("const involvedEntityIds = new Set<string>([")
          event_insert_start = source.index("await sql`", involved_start)
          indentation = source[source.rfind("\n", 0, event_insert_start) + 1 : event_insert_start]
          immutable_declarations = (
              f"{indentation}const playerVisibleFacts = (input.playerVisibleFacts || []).slice(0, 64);\n"
              f"{indentation}const hiddenFacts = (input.hiddenFacts || []).slice(0, 64);\n"
              f"{indentation}const immutableEventPayload = {{\n"
              f"{indentation}  status: \"committed\",\n"
              f"{indentation}  receiptId,\n"
              f"{indentation}  requestHash,\n"
              f"{indentation}  authority: input.authority,\n"
              f"{indentation}  sourcePlanId: input.sourcePlanId || null,\n"
              f"{indentation}  sourceStepId: input.sourceStepId || null,\n"
              f"{indentation}  operationTypes: branch.operations.map(({{ type }}) => type),\n"
              f"{indentation}  playerVisibleFacts,\n"
              f"{indentation}  hiddenFacts,\n"
              f"{indentation}}};\n\n"
          )
          source = source[:event_insert_start] + immutable_declarations + source[event_insert_start:]

          insertion_pattern = re.compile(
              r"(\$\{input\.idempotencyKey\},\s*now\(\),\s*'world_mutation',)\s*"
              r"'\[\]'::jsonb,\s*"
              r"\$\{json\(\{\s*status:\s*\"applying\",\s*requestHash\s*\}\)\}::jsonb,",
              re.DOTALL,
          )
          source, insertion_count = insertion_pattern.subn(
              r"\1\n              ${json([...involvedEntityIds])}::jsonb,\n"
              r"              ${json(immutableEventPayload)}::jsonb,",
              source,
              count=1,
          )
          if insertion_count != 1:
              raise SystemExit(f"Expected one provisional event insertion; found {insertion_count}")

          finalization_pattern = re.compile(
              r"(?ms)^\s*const symbolMap = publicSymbolMap\(symbols\);\s*"
              r"const playerVisibleFacts = .*?"
              r"^\s*await sql`\s*\n\s*UPDATE game\.event_ledger.*?^\s*`;\s*\n"
              r"(?=\s*await sql`\s*\n\s*INSERT INTO game\.mutation_receipts)",
          )
          source, finalization_count = finalization_pattern.subn(
              f"{indentation}const symbolMap = publicSymbolMap(symbols);\n",
              source,
              count=1,
          )
          if finalization_count != 1:
              raise SystemExit(f"Expected one mutable event finalization block; found {finalization_count}")
          if "UPDATE game.event_ledger" in source:
              raise SystemExit("Event-ledger update remains after patch")

          path.write_text(source)
          PY
          pnpm exec prettier --write packages/database/src/universal-operation-executor.ts
      - name: Commit executor correction
        run: |
          if git diff --quiet; then
            echo "Executor already uses immutable event insertion."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/universal-operation-executor.ts
          git commit -m "fix: commit universal events immutably"
          git push origin HEAD:ci/exhaustive-gameplay-certification
