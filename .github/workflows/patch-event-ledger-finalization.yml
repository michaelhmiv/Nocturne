# One-shot branch repair; remove after the executor commit lands.
name: Patch Immutable Event Finalization

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-immutable-event-finalization
  cancel-in-progress: true

jobs:
  patch:
    name: Patch / Immutable Event Finalization
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'ci/exhaustive-gameplay-certification'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/exhaustive-gameplay-certification
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace two-phase event mutation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/database/src/universal-operation-executor.ts")
          source = path.read_text()

          if "immutableEventPayload" in source and "UPDATE game.event_ledger" not in source:
              print("Immutable event finalization is already patched.")
              raise SystemExit(0)

          involved_start = source.index(
              "        const involvedEntityIds = new Set<string>(["
          )
          event_insert_start = source.index("        await sql`", involved_start)
          immutable_declarations = (
              "        const playerVisibleFacts = (input.playerVisibleFacts || []).slice(0, 64);\n"
              "        const hiddenFacts = (input.hiddenFacts || []).slice(0, 64);\n"
              "        const immutableEventPayload = {\n"
              "          status: \"committed\",\n"
              "          receiptId,\n"
              "          requestHash,\n"
              "          authority: input.authority,\n"
              "          sourcePlanId: input.sourcePlanId || null,\n"
              "          sourceStepId: input.sourceStepId || null,\n"
              "          operationTypes: branch.operations.map(({ type }) => type),\n"
              "          playerVisibleFacts,\n"
              "          hiddenFacts,\n"
              "        };\n\n"
          )
          source = (
              source[:event_insert_start]
              + immutable_declarations
              + source[event_insert_start:]
          )

          old_insert_values = (
              "              ${input.idempotencyKey}, now(), 'world_mutation', '[]'::jsonb,\n"
              "              ${json({ status: \"applying\", requestHash })}::jsonb,\n"
          )
          new_insert_values = (
              "              ${input.idempotencyKey}, now(), 'world_mutation',\n"
              "              ${json([...involvedEntityIds])}::jsonb,\n"
              "              ${json(immutableEventPayload)}::jsonb,\n"
          )
          if old_insert_values not in source:
              raise SystemExit("Expected event insertion values were not found")
          source = source.replace(old_insert_values, new_insert_values, 1)

          finalize_start = source.index(
              "        const symbolMap = publicSymbolMap(symbols);"
          )
          receipt_insert_start = source.index(
              "        await sql`\n          INSERT INTO game.mutation_receipts",
              finalize_start,
          )
          source = (
              source[:finalize_start]
              + "        const symbolMap = publicSymbolMap(symbols);\n"
              + source[receipt_insert_start:]
          )

          if "UPDATE game.event_ledger" in source:
              raise SystemExit("Event-ledger update remains after patch")
          path.write_text(source)
          PY
          pnpm exec prettier --write packages/database/src/universal-operation-executor.ts
      - name: Commit executor correction
        run: |
          if git diff --quiet; then
            echo "Executor already uses immutable event insertion."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/universal-operation-executor.ts
          git commit -m "fix: commit universal events immutably"
          git push origin HEAD:ci/exhaustive-gameplay-certification
