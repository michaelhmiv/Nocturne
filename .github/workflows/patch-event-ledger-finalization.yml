name: Patch Immutable Event Finalization

on:
  push:
    branches:
      - ci/exhaustive-gameplay-certification
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-immutable-event-finalization
  cancel-in-progress: true

jobs:
  patch:
    name: Patch / Immutable Event Finalization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/exhaustive-gameplay-certification
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace two-phase event mutation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/database/src/universal-operation-executor.ts")
          source = path.read_text()

          old_insert = '''        const operationResults: Record<string, unknown>[] = [];
          const involvedEntityIds = new Set<string>([
            ...(input.actorId ? [input.actorId] : []),
            ...collectExistingEntityIds(branch.operations),
          ]);

          await sql`
            INSERT INTO game.event_ledger (
              event_id, world_id, shard_id, idempotency_key, world_time,
              event_type, involved_entity_ids, payload, source_intent_id
            ) VALUES (
              ${eventId}, ${input.scope.worldId}, ${input.scope.shardId},
              ${input.idempotencyKey}, now(), 'world_mutation', '[]'::jsonb,
              ${json({ status: "applying", requestHash })}::jsonb,
              ${input.sourceIntentId || null}
            )
          `;
          '''

          new_insert = '''        const operationResults: Record<string, unknown>[] = [];
          const involvedEntityIds = new Set<string>([
            ...(input.actorId ? [input.actorId] : []),
            ...collectExistingEntityIds(branch.operations),
          ]);
          const playerVisibleFacts = (input.playerVisibleFacts || []).slice(0, 64);
          const hiddenFacts = (input.hiddenFacts || []).slice(0, 64);
          const immutableEventPayload = {
            status: "committed",
            receiptId,
            requestHash,
            authority: input.authority,
            sourcePlanId: input.sourcePlanId || null,
            sourceStepId: input.sourceStepId || null,
            operationTypes: branch.operations.map(({ type }) => type),
            playerVisibleFacts,
            hiddenFacts,
          };

          await sql`
            INSERT INTO game.event_ledger (
              event_id, world_id, shard_id, idempotency_key, world_time,
              event_type, involved_entity_ids, payload, source_intent_id
            ) VALUES (
              ${eventId}, ${input.scope.worldId}, ${input.scope.shardId},
              ${input.idempotencyKey}, now(), 'world_mutation',
              ${json([...involvedEntityIds])}::jsonb,
              ${json(immutableEventPayload)}::jsonb,
              ${input.sourceIntentId || null}
            )
          `;
          '''

          old_finalize = '''        const symbolMap = publicSymbolMap(symbols);
          const playerVisibleFacts = (input.playerVisibleFacts || []).slice(0, 64);
          const hiddenFacts = (input.hiddenFacts || []).slice(0, 64);
          const eventPayload = {
            status: "committed",
            receiptId,
            requestHash,
            authority: input.authority,
            sourcePlanId: input.sourcePlanId || null,
            sourceStepId: input.sourceStepId || null,
            symbolMap,
            operationResults,
            playerVisibleFacts,
            hiddenFacts,
          };
          await sql`
            UPDATE game.event_ledger
            SET involved_entity_ids = ${json([...involvedEntityIds])}::jsonb,
                payload = ${json(eventPayload)}::jsonb
            WHERE event_id = ${eventId}
          `;
          '''

          new_finalize = '''        const symbolMap = publicSymbolMap(symbols);
          '''

          if old_insert not in source:
              if "immutableEventPayload" in source and "UPDATE game.event_ledger" not in source:
                  print("Immutable event finalization is already patched.")
                  raise SystemExit(0)
              raise SystemExit("Expected event insertion block was not found")
          if old_finalize not in source:
              raise SystemExit("Expected event finalization block was not found")

          source = source.replace(old_insert, new_insert, 1)
          source = source.replace(old_finalize, new_finalize, 1)
          path.write_text(source)
          PY
          pnpm exec prettier --write packages/database/src/universal-operation-executor.ts
      - name: Commit executor correction
        run: |
          if git diff --quiet; then
            echo "Executor already uses immutable event insertion."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/database/src/universal-operation-executor.ts
          git commit -m "fix: commit universal events immutably"
          git push origin HEAD:ci/exhaustive-gameplay-certification
