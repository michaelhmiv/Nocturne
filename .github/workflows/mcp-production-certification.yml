name: MCP Production Certification

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: mcp-production-certification
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run OAuth and MCP production certification
        id: certification
        env:
          NOCTURNE_WEB_URL: https://nocturneweb-production.up.railway.app
          NOCTURNE_MCP_URL: https://nocturnemcp-production.up.railway.app
        run: |
          mkdir -p artifacts
          set -o pipefail
          node scripts/ci/mcp-production-certification.mjs 2>&1 | tee artifacts/mcp-production-certification.log
      - name: Upload MCP production certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-production-certification-${{ github.run_id }}
          path: artifacts/mcp-production-certification.log
          if-no-files-found: error
      - name: Publish certification summary to epic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_OUTCOME: ${{ steps.certification.outcome }}
        run: |
          {
            echo "### MCP Production Certification — ${CERT_OUTCOME}"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo
            echo "<details><summary>Case summary</summary>"
            echo
            echo '```text'
            if [[ -f artifacts/mcp-production-certification.log ]]; then
              summary_lines="$(grep -E '^\s*"(status|passed|failed|expectedCases|id|title|error)"\s*:' artifacts/mcp-production-certification.log || true)"
              if [[ -n "${summary_lines}" ]]; then
                printf '%s\n' "${summary_lines}" | tail -n 180
              else
                tail -n 80 artifacts/mcp-production-certification.log
              fi
            else
              echo "Certification log was not created."
            fi
            echo '```'
            echo
            echo "</details>"
          } > artifacts/mcp-production-certification-summary.md
          gh issue comment 113 --repo "${GITHUB_REPOSITORY}" --body-file artifacts/mcp-production-certification-summary.md
